<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gareng Orb Preview</title>
<style>
  :root { --bg: #04070D; --fg: #DDF7FF; --muted: #6E8C99; --line: #12303D; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: flex; justify-content: center; align-items: center; }
  .tv { position: relative; height: 100vh; width: min(100vw, 56.25vh); display: flex; flex-direction: column; align-items: center; overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, #0A1A26 0%, var(--bg) 70%); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .brand { margin-top: 4vh; font-size: 1.7vh; letter-spacing: .5em; color: var(--muted); }
  .brand b { color: var(--fg); font-weight: 600; }
  canvas { width: 100%; flex: 1; min-height: 0; }
  .status { font-size: 1.5vh; letter-spacing: .35em; text-transform: uppercase; transition: color .4s; }
  .caption { min-height: 9vh; padding: 1.5vh 6% 0; text-align: center; font-size: 2.6vh; line-height: 1.4; font-weight: 300; transition: opacity .35s; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .8vh; padding: 2vh 4% 3vh; }
  button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: .9vh 1.6vh; font-size: 1.4vh; cursor: pointer; }
  button.on { border-color: currentColor; color: #4FE3FF; }
  .note { font-size: 1.2vh; color: var(--muted); padding-bottom: 2vh; }
</style>
</head>
<body>
<div class="tv">
  <div class="brand"><b>GARENG</b> · SEMAR AI CASHIER</div>
  <canvas id="orb"></canvas>
  <div class="status" id="status">siaga</div>
  <div class="caption" id="caption">Halo kak, mau pesan apa hari ini?</div>
  <div class="controls" id="controls">
    <button data-s="idle">Siaga</button>
    <button data-s="listen">Mendengar</button>
    <button data-s="think">Berpikir</button>
    <button data-s="speak">Bicara</button>
    <button data-s="success">Berhasil</button>
    <button id="demo" class="on">Demo otomatis</button>
    <button id="mic">Pakai mic asli</button>
  </div>
  <div class="note">Preview desain · bukan aplikasi</div>
</div>

<script>
const STATES = {
  idle:    { color: [79, 227, 255],  speed: 0.25, scale: 1.00, amp: 0.05, label: 'siaga',     text: 'Halo kak, mau pesan apa hari ini?' },
  listen:  { color: [79, 227, 255],  speed: 0.55, scale: 1.08, amp: 0.55, label: 'mendengar', text: '"Kopi susu dua, yang satu less sugar..."' },
  think:   { color: [247, 183, 51],  speed: 2.20, scale: 0.94, amp: 0.10, label: 'berpikir',  text: 'Sebentar ya kak...' },
  speak:   { color: [79, 227, 255],  speed: 0.70, scale: 1.04, amp: 0.80, label: 'bicara',    text: 'Siap! Dua kopi susu, satu less sugar. Mau sekalian croissant hangat?' },
  success: { color: [61, 220, 151],  speed: 0.50, scale: 1.12, amp: 0.30, label: 'berhasil',  text: 'Pembayaran diterima. Terima kasih, kak!' },
};
const DEMO = ['idle', 'listen', 'think', 'speak', 'listen', 'think', 'success'];
const DEMO_MS = { idle: 3500, listen: 3000, think: 1800, speak: 4200, success: 3000 };

const cv = document.getElementById('orb'), ctx = cv.getContext('2d');
const statusEl = document.getElementById('status'), captionEl = document.getElementById('caption');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let state = 'idle';
const cur = { color: [...STATES.idle.color], speed: .25, scale: 1, amp: .05 };
let flash = 0, rot = 0, level = 0, analyser = null, micBuf = null;

function setState(s) {
  state = s;
  if (s === 'success') flash = 1;
  statusEl.textContent = STATES[s].label;
  const [r, g, b] = STATES[s].color;
  statusEl.style.color = `rgb(${r},${g},${b})`;
  captionEl.style.opacity = 0;
  setTimeout(() => { captionEl.textContent = STATES[s].text; captionEl.style.opacity = 1; }, 250);
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}

// kebisingan halus (gabungan sinus) supaya gerak terasa organik
const noise = (x, t) => Math.sin(x * 1.7 + t * 2.1) * .5 + Math.sin(x * 3.3 - t * 3.7) * .3 + Math.sin(x * 7.1 + t * 5.3) * .2;

function targetLevel(t) {
  if (analyser) {
    analyser.getByteTimeDomainData(micBuf);
    let sum = 0; for (const v of micBuf) sum += ((v - 128) / 128) ** 2;
    return Math.min(1, Math.sqrt(sum / micBuf.length) * 6);
  }
  if (state === 'speak') return Math.abs(Math.sin(t * 9)) * (.55 + .45 * Math.sin(t * 2.3)) ;
  if (state === 'listen') return .35 + .35 * Math.abs(noise(1, t * 1.5));
  return .15 + .1 * Math.sin(t * 1.2);
}

const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const particles = Array.from({ length: 70 }, () => ({ a: Math.random() * 6.283, r: .62 + Math.random() * .5, s: .1 + Math.random() * .4, z: Math.random() }));

function frame(ms) {
  const t = ms / 1000, tg = STATES[state];
  for (let i = 0; i < 3; i++) cur.color[i] += (tg.color[i] - cur.color[i]) * .06;
  cur.speed += (tg.speed - cur.speed) * .05;
  cur.scale += (tg.scale - cur.scale) * .06;
  cur.amp += (tg.amp - cur.amp) * .08;
  level += (targetLevel(t) - level) * .25;
  flash *= .96;
  rot += cur.speed * .016;

  const c = cur.color, cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * .42 * cur.scale, a = cur.amp * level;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // cahaya latar
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.25);
  g.addColorStop(0, rgba(c, .22 + a * .15)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.25, 0, 6.283); ctx.fill();

  // inti
  const core = R * (.2 + a * .07);
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 1.8);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.35, rgba(c, .85)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core * 1.8, 0, 6.283); ctx.fill();

  ctx.shadowColor = rgba(c, .9); ctx.shadowBlur = 18; ctx.lineCap = 'round';

  // batang radial (gelombang suara)
  const bars = 96;
  for (let i = 0; i < bars; i++) {
    const ang = i / bars * 6.283 + rot * .3;
    const len = R * (.03 + a * .16 * (.5 + .5 * noise(i * .35, t * 2)));
    const r0 = R * .34;
    ctx.strokeStyle = rgba(c, .35 + a * .5); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang) * (r0 + len), cy + Math.sin(ang) * (r0 + len));
    ctx.stroke();
  }

  // cincin gelombang
  ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 180; i++) {
    const ang = i / 180 * 6.283;
    const r = R * (.55 + a * .05 * noise(ang * 3, t * 3));
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // busur tersegmen berputar
  ctx.lineWidth = 4; ctx.strokeStyle = rgba(c, .8);
  for (let k = 0; k < 3; k++) {
    const s = rot + k * 2.094;
    ctx.beginPath(); ctx.arc(cx, cy, R * .66, s, s + 1.25); ctx.stroke();
  }
  ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(c, .5);
  for (let k = 0; k < 2; k++) {
    const s = -rot * 1.6 + k * 3.1416;
    ctx.beginPath(); ctx.arc(cx, cy, R * .72, s, s + .5); ctx.stroke();
  }

  // skala jarum jam
  ctx.shadowBlur = 0;
  const ticks = 120;
  for (let i = 0; i < ticks; i++) {
    const ang = i / ticks * 6.283 - rot * .4, major = i % 10 === 0;
    const r1 = R * .8, r2 = R * (major ? .86 : .83);
    ctx.strokeStyle = rgba(c, major ? .75 : .28); ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
    ctx.lineTo(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
    ctx.stroke();
  }

  // cincin luar + penanda cepat
  ctx.strokeStyle = rgba(c, .25); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R * .95, 0, 6.283); ctx.stroke();
  ctx.shadowBlur = 14; ctx.strokeStyle = rgba(c, .95); ctx.lineWidth = 3;
  const fast = rot * 2.5;
  ctx.beginPath(); ctx.arc(cx, cy, R * .95, fast, fast + .18); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * .95, fast + 3.14, fast + 3.32); ctx.stroke();

  // partikel mengorbit
  ctx.shadowBlur = 8;
  for (const p of particles) {
    p.a += p.s * cur.speed * .02;
    const r = R * p.r * (1 + a * .08 * Math.sin(t * 3 + p.z * 9));
    ctx.fillStyle = rgba(c, .25 + p.z * .6);
    ctx.beginPath(); ctx.arc(cx + Math.cos(p.a) * r, cy + Math.sin(p.a) * r * .98, .8 + p.z * 1.6, 0, 6.283); ctx.fill();
  }

  // gelombang kejut saat berhasil
  if (flash > .02) {
    ctx.strokeStyle = rgba(c, flash); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, R * (1.25 - flash * .6), 0, 6.283); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// demo otomatis berputar antar keadaan
let demoOn = true, demoIdx = 0, demoTimer;
function demoStep() {
  if (!demoOn) return;
  setState(DEMO[demoIdx]);
  demoTimer = setTimeout(() => { demoIdx = (demoIdx + 1) % DEMO.length; demoStep(); }, DEMO_MS[DEMO[demoIdx]]);
}
const demoBtn = document.getElementById('demo');
demoBtn.onclick = () => { demoOn = !demoOn; demoBtn.classList.toggle('on', demoOn); clearTimeout(demoTimer); if (demoOn) demoStep(); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  demoOn = false; demoBtn.classList.remove('on'); clearTimeout(demoTimer); setState(b.dataset.s);
});

// mic asli: orb bereaksi ke suara sungguhan
document.getElementById('mic').onclick = async (e) => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(), src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 1024;
    micBuf = new Uint8Array(analyser.fftSize); src.connect(analyser);
    e.target.classList.add('on'); e.target.textContent = 'Mic aktif';
    demoOn = false; demoBtn.classList.remove('on'); clearTimeout(demoTimer); setState('listen');
  } catch { e.target.textContent = 'Mic ditolak'; }
};
demoStep();
</script>
</body>
</html>
